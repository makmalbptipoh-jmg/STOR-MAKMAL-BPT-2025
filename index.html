<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BILIK PENYIMPANAN BARANG MAKMAL</title>

  <!-- Bulma CSS Framework -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"/>

  <!-- Font Awesome untuk ikon carian -->
  <script src="https://use.fontawesome.com/releases/v5.3.1/js/all.js"></script>

  <!-- Google Font: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

  <style>
    /* Opsyen A: Gradient + gambar bg untuk header hero */
    .hero.is-primary{
      background-image:
        linear-gradient(135deg, rgba(22,160,133,.85), rgba(26,188,156,.85)),
        url('./bg.jpg'); /* ubah laluan jika perlu */
      background-position:center;
      background-size:cover;
      background-repeat:no-repeat;
    }

    /* Tajuk */
    h1.title{
      font-family:'Poppins',sans-serif;
      font-size:2.2rem;
      font-weight:600;
      color:#fff;
      text-shadow:1px 2px 4px rgba(0,0,0,.25);
    }

    /* Susun atur: carian + logout */
    .top-actions{
      display:flex;
      align-items:center;
      gap:.75rem;
      margin-top:1rem;
      margin-right:1rem;
    }

    /* === Pelaras lebar kotak carian === */
    .top-actions .search-box{
      flex:0 0 40%;   /* ambil 40% ruang di desktop */
      max-width:40%;
    }
    .top-actions .search-box .input{ width:100%; } /* pastikan input penuh dalam box */
    .top-actions .logout-btn{ white-space:nowrap; }

    /* Mobile: tindan menegak & search penuh 100% */
    @media (max-width:768px){
      .top-actions{
        flex-direction:column;
        align-items:stretch;
        margin-right:0;
      }
      .top-actions .search-box{
        flex:1 1 auto;
        max-width:100%;
        width:100%;
      }
      .top-actions .logout-btn{ width:100%; }
    }

    /* Item keputusan carian dalam modal */
    .search-result-item{
      padding:.5rem .75rem;
      border-bottom:1px solid #dbdbdb;
      cursor:pointer;
      transition:background-color .2s;
    }
    .search-result-item:hover{background:#f5f5f5}
    .search-result-item:last-child{border-bottom:none}
    .search-result-item p{font-weight:bold}
    .search-result-item span{font-style:italic;color:#7a7a7a}
  </style>
</head>

<body class="theme-forest">
  <section class="hero is-primary is-bold">
    <div class="hero-body">
      <div class="container has-text-centered">
        <h1 class="title">BILIK PENYIMPANAN BARANG MAKMAL</h1>
      </div>
    </div>
  </section>

  <!-- Login -->
  <div id="login-box" class="container m-4 pl-4">
    <div class="field">
      <label class="label">Kata Laluan</label>
      <div class="control">
        <input class="input" style="width:250px" type="password" id="password-input" placeholder="Masukkan kata laluan">
      </div>
    </div>
    <button class="button is-primary" id="login-button">Masuk</button>
    <p id="login-msg" class="has-text-danger mt-2"></p>
  </div>

  <!-- Borang (hidden until password is correct) -->
  <form id="form" class="container m-4 pl-4" style="display:none;">

    <!-- Carian + Logout -->
    <div class="container top-actions">
      <div class="control has-icons-left search-box">
        <input class="input" type="text" id="item-search-input" placeholder="Cari Kod/Nama Item...">
        <span class="icon is-small is-left"><i class="fas fa-search"></i></span>
      </div>
      <button type="button" class="button is-success logout-btn" id="logout-button">Log keluar</button>
    </div>

    <div class="field">
      <label class="label">Nama Pengguna</label>
      <div class="control">
        <div class="select is-fullwidth">
          <select name="Nama_Pengguna" required>
            <option value="">-- Sila Pilih Nama Pengguna --</option>
            <option>MOHAMAD ASWANDI BIN ARIFF</option>
            <option>MOHD FUZI BIN HASHIM</option>
            <option>MOHD FAHAMI BIN ABAS</option>
            <option>PASUPATI A/L SUBRAMANIAM</option>
            <option>SHARIZAN BIN IBRAHIM</option>
            <option>AZRUL BIN ARIFFIN</option>
            <option>MOHD ZAHAR BIN IBRAHIM</option>
            <option>NURUL HUSNA BINTI ISMAYATIM</option>
            <option>AKRIMI MASUA BINTI MOHAMAD</option>
            <option>MOHAMMAD NUR HAFIZ BIN HAMID</option>
            <option>TAMILARASI A/P GANASAN</option>
            <option>NUR AFINI BINTI ISMAIL</option>
            <option>MARIHAM BINTI YAACOB</option>
            <option>NAZILAH BINTI AHMAD NAZRI</option>
            <option>KHATIB BIN MD YAN</option>
            <option>ABDUL RANI BIN ABU BAKAR</option>
            <option>FAHIMAH ZAIDAH BINTI ZAINUL ABIDIN</option>
            <option>SURAYA BINTI ABDULLAH SANI</option>
            <option>SAEDA A/P ANJANG</option>
            <option>WAN MOHD SUBRI BIN WAN ABDULLAH</option>
            <option>MUHAMAD ARIF BIN ABDUL KARIM</option>
            <option>WAN ERDALINA BINTI WAN DALI</option>
            <option>AMIRUL ZAKI BIN ISHAK</option>
            <option>AMIRUL ZAHIM BIN MD ZAKARIA</option>
            <option>MAJDI BIN BALI</option>
            <option>CLYDERICK BONAVENTURE</option>
            <option>SURAYA BINTI ANUAR</option>
            <option>NUR AMIRAH IZZATI BINTI MAT AROP</option>
            <option>FAKHRUL ANWAR BIN NOOR ARMAN</option>
            <option>SITI YUS SYAFEERA BINTI SAPUAN</option>
            <option>NUR ADILAH BINTI MAT NOR</option>
            <option>RUBENS CHIA</option>
            <option>WAN MOHD FAIZ BIN WAN MASRI</option>
            <option>NUR EFFA IZATI BINTI ABDUL HAMID</option>
            <option>SYAHRUL NIZAM BIN MOHD ZURAINI</option>
            <option>SAIFUL BAHARIL BIN ABU BAKAR</option>
            <option>RASHID BIN SHAPEE</option>
            <option>MOHAMAD HANIF BIN MUSLIMAN</option>
            <option>MOHD EZRULFAZLY BIN LEMAN</option>
            <option>FARAH NADIRAH BINTI SHALUDIN</option>
          </select>
        </div>
      </div>
    </div>

    <div class="field">
      <label class="label">Unit Makmal</label>
      <div class="control">
        <div class="select is-fullwidth">
          <select name="Unit_Makmal" required>
            <option value="">-- Sila Pilih Unit --</option>
            <option value="MBA">MBA</option>
            <option value="MPI">MPI</option>
            <option value="BA">BA</option>
          </select>
        </div>
      </div>
    </div>

    <div class="field">
      <label class="label">Kod Item</label>
      <div class="control">
        <div class="select is-fullwidth">
          <select name="Kod_Item" id="kod-item-select" required>
            <option value="">-- Sila Pilih Kod Item --</option>
          </select>
        </div>
      </div>
    </div>

    <div class="field">
      <label class="label">Nama Item</label>
      <div class="control">
        <div class="select is-fullwidth">
          <select name="Nama_Item" id="nama-item-select" required>
            <option value="">-- Nama Item --</option>
          </select>
        </div>
      </div>
      <p class="help is-info" id="item-info"></p>
    </div>

    <div class="field">
      <label class="label">Kuantiti</label>
      <div class="control">
        <input class="input" type="number" name="Kuantiti" id="qty-input" required min="1" max="500" step="1" placeholder="1 - 500" />
      </div>
    </div>

    <div class="field">
      <label class="label">Tujuan Kegunaan</label>
      <div class="control">
        <textarea class="textarea" name="Tujuan_Kegunaan" placeholder="Maklumat Kegunaan"></textarea>
      </div>
    </div>

    <div class="field">
      <label class="label">Setuju Terma</label>
      <div class="control">
        <label class="checkbox">
          <input type="checkbox" name="Setuju_Terma" value="yes" required />
          Saya bersetuju dengan terma dan syarat
        </label>
      </div>
    </div>

    <div class="field is-grouped">
      <div class="control">
        <button class="button is-primary" type="submit" id="submit-button">Hantar</button>
      </div>
      <div class="control">
        <button class="button is-danger" type="button" id="cancel-button">Batal</button>
      </div>
    </div>
  </form>

  <!-- Mesej status (notifikasi kecil) -->
  <div id="message" class="container" style="display:none;"></div>

  <!-- Modal carian -->
  <div class="modal" id="search-modal">
    <div class="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title">Hasil Carian</p>
        <button class="delete" aria-label="close" id="close-modal-button"></button>
      </header>
      <section class="modal-card-body" id="modal-content-body"></section>
      <footer class="modal-card-foot is-justify-content-flex-end">
        <button class="button is-success" id="ok-modal-button">OK</button>
      </footer>
    </div>
  </div>

  <!-- Modal pengesahan selepas hantar -->
  <div class="modal" id="confirm-modal">
    <div class="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title">Permintaan Dihantar</p>
        <button class="delete" aria-label="close" id="confirm-close-x"></button>
      </header>
      <section class="modal-card-body">
        <p class="mb-2">Maklumat permintaan anda:</p>
        <div class="content">
          <p><strong>Item:</strong> <span id="confirm-item">-</span></p>
          <p><strong>Kuantiti:</strong> <span id="confirm-qty">-</span></p>
          <p><strong>Ambil di:</strong> <span id="confirm-lokasi">-</span></p>
          <p><strong>Baki selepas ini:</strong> <span id="confirm-baki">-</span></p>
        </div>
      </section>
      <footer class="modal-card-foot is-justify-content-flex-end">
        <button class="button is-success" id="confirm-ok">OK</button>
      </footer>
    </div>
  </div>


  <script>
    // URL Web App Apps Script (kekal sama selepas "New version" deployment)
    const scriptURL = "https://script.google.com/macros/s/AKfycbyAtEO6DNB0y_1a2TOrvyA2YwDMGOtZ7C9rtwjliXre44tiT3S71RBZBrBtlYnwGcddVg/exec";
    const PW_KEY = "bpt_pw"; // kata laluan disimpan sementara dalam sesi tab ini sahaja

    // ========= Elemen =========
    const loginBox   = document.getElementById("login-box");
    const loginBtn   = document.getElementById("login-button");
    const loginMsg   = document.getElementById("login-msg");
    const pwInput    = document.getElementById("password-input");
    const form       = document.getElementById("form");
    const codeSelect = document.getElementById("kod-item-select");
    const nameSelect = document.getElementById("nama-item-select");
    const itemInfo   = document.getElementById("item-info");
    const qtyInput   = document.getElementById("qty-input");
    const searchInput  = document.getElementById("item-search-input");
    const submitButton = document.getElementById("submit-button");
    const messageDiv   = document.getElementById("message");
    const searchModal  = document.getElementById("search-modal");
    const modalContent = document.getElementById("modal-content-body");

    const confirmModal  = document.getElementById("confirm-modal");
    const confirmItemEl = document.getElementById("confirm-item");
    const confirmQtyEl  = document.getElementById("confirm-qty");
    const confirmLokEl  = document.getElementById("confirm-lokasi");
    const confirmBakiEl = document.getElementById("confirm-baki");

    let allItems = [];

    // ========= Panggilan ke Apps Script =========
    async function callApi(payload){
      const res = await fetch(scriptURL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      if(!res.ok) throw new Error("Pelayan tidak dapat dihubungi (" + res.status + ")");
      return res.json();
    }

    function getPw(){ return sessionStorage.getItem(PW_KEY) || ""; }

    // ========= Login =========
    async function doLogin(pw){
      loginBtn.classList.add("is-loading"); loginBtn.disabled = true; loginMsg.textContent = "";
      try{
        const data = await callApi({ action: "login", password: pw });
        if(data.status !== "success") throw new Error(data.message || "Kata laluan salah.");
        sessionStorage.setItem(PW_KEY, pw);
        pwInput.value = "";
        loginBox.style.display = "none";
        form.style.display = "block";
        await loadItems();
      }catch(err){
        sessionStorage.removeItem(PW_KEY);
        loginBox.style.display = "block";
        form.style.display = "none";
        loginMsg.textContent = err.message;
      }finally{
        loginBtn.classList.remove("is-loading"); loginBtn.disabled = false;
      }
    }

    loginBtn.addEventListener("click", () => doLogin(pwInput.value));
    pwInput.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); doLogin(pwInput.value); } });
    if(getPw()) doLogin(getPw()); // sambung semula jika tab dimuat semula

    document.getElementById("logout-button").addEventListener("click", () => {
      sessionStorage.removeItem(PW_KEY);
      form.reset(); itemInfo.textContent = "";
      form.style.display = "none";
      loginBox.style.display = "block";
    });

    // ========= Senarai item dari Senarai Stok =========
    async function loadItems(){
      setMessage("info", "Memuatkan senarai item...");
      const data = await callApi({ action: "items", password: getPw() });
      if(data.status !== "success") throw new Error(data.message || "Gagal memuatkan item.");
      allItems = data.items || [];
      populateSelects(allItems);
      messageDiv.style.display = "none";
    }

    function bakiText(it){
      if(it.baki === null || it.baki === undefined) return "belum dikira";
      return it.baki + " " + it.unit;
    }

    function populateSelects(items){
      codeSelect.innerHTML = '<option value="">-- Sila Pilih Kod Item --</option>';
      nameSelect.innerHTML = '<option value="">-- Nama Item --</option>';
      items.forEach(it => {
        const habis = it.status === "HABIS";
        const o1 = document.createElement("option");
        o1.value = it.code;
        o1.textContent = it.code + (habis ? " (HABIS)" : "");
        o1.disabled = habis;
        codeSelect.appendChild(o1);

        const o2 = document.createElement("option");
        o2.value = it.code;               // nilai = kod supaya nama berulang tidak keliru
        o2.textContent = it.name + (habis ? " (HABIS)" : "");
        o2.disabled = habis;
        nameSelect.appendChild(o2);
      });
    }

    function findItem(code){ return allItems.find(i => i.code === code); }

    function showItemInfo(code){
      const it = findItem(code);
      if(!it){ itemInfo.textContent = ""; qtyInput.removeAttribute("max"); return; }
      itemInfo.textContent = "Baki: " + bakiText(it) + "  |  Lokasi: " + (it.lokasi || "-");
      if(typeof it.baki === "number" && it.baki > 0) qtyInput.max = it.baki; else qtyInput.max = 500;
      qtyInput.placeholder = "1 - " + qtyInput.max + (it.unit ? " (" + it.unit + ")" : "");
    }

    codeSelect.addEventListener("change", () => { nameSelect.value = codeSelect.value; showItemInfo(codeSelect.value); });
    nameSelect.addEventListener("change", () => { codeSelect.value = nameSelect.value; showItemInfo(nameSelect.value); });

    // ========= Carian (kod atau nama) =========
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }

    function showSearchResults(results){
      if(results.length === 0){
        modalContent.innerHTML = '<p class="has-text-centered">Tiada hasil carian ditemui.</p>';
      }else{
        modalContent.innerHTML = results.slice(0, 50).map(it => `
          <div class="search-result-item" data-code="${escapeHtml(it.code)}">
            <p>${escapeHtml(it.name)}</p>
            <span>Kod: ${escapeHtml(it.code)} · Baki: ${escapeHtml(bakiText(it))}${it.status === "HABIS" ? " · HABIS" : ""}</span>
          </div>`).join("");
      }
      searchModal.classList.add("is-active");
    }

    modalContent.addEventListener("click", e => {
      const row = e.target.closest(".search-result-item");
      if(!row) return;
      const it = findItem(row.dataset.code);
      if(!it || it.status === "HABIS"){ return; }
      codeSelect.value = it.code; nameSelect.value = it.code; showItemInfo(it.code);
      searchModal.classList.remove("is-active");
      searchInput.value = "";
    });

    searchInput.addEventListener("input", e => {
      const term = e.target.value.trim().toLowerCase();
      if(term.length > 0){
        showSearchResults(allItems.filter(i => i.code.toLowerCase().includes(term) || i.name.toLowerCase().includes(term)));
      }else{
        searchModal.classList.remove("is-active");
      }
    });

    // ========= Notifikasi =========
    function setMessage(type, text){
      messageDiv.innerHTML = '<div class="notification is-' + type + '">' + escapeHtml(text) + '</div>';
      messageDiv.style.display = "block";
    }

    // ========= Hantar borang =========
    form.addEventListener("submit", async e => {
      e.preventDefault();
      if(!getPw()){ setMessage("danger", "Sila log masuk dahulu."); return; }

      const fd = new FormData(form);
      const obj = { action: "submit", password: getPw() };
      for(const [k, v] of fd.entries()) obj[k] = v;
      obj.Kod_Item = codeSelect.value;
      const it = findItem(obj.Kod_Item);
      if(!it){ setMessage("danger", "Sila pilih item."); return; }
      obj.Nama_Item = it.name;
      obj.Kuantiti = Number(obj.Kuantiti);

      setMessage("info", "Sedang menghantar...");
      submitButton.disabled = true; submitButton.classList.add("is-loading");
      try{
        const data = await callApi(obj);
        if(data.status === "success"){
          confirmItemEl.textContent = data.item + " (" + data.kod + ")";
          confirmQtyEl.textContent  = data.kuantiti + " " + (data.unit || "");
          confirmLokEl.textContent  = data.lokasi || "-";
          confirmBakiEl.textContent = data.bakiBaru === null ? "belum dikira" : data.bakiBaru + " " + (data.unit || "");
          confirmModal.classList.add("is-active");
          setMessage("success", "Permintaan berjaya dihantar.");
          form.reset(); itemInfo.textContent = "";
          loadItems().catch(() => {}); // segarkan baki
        }else{
          if(data.code === "AUTH"){ sessionStorage.removeItem(PW_KEY); form.style.display = "none"; loginBox.style.display = "block"; }
          throw new Error(data.message || "Gagal dihantar");
        }
      }catch(err){
        setMessage("danger", "Ralat: " + err.message);
      }finally{
        submitButton.disabled = false; submitButton.classList.remove("is-loading");
        setTimeout(() => { messageDiv.style.display = "none"; }, 5000);
      }
    });

    document.getElementById("cancel-button").addEventListener("click", () => {
      form.reset(); itemInfo.textContent = ""; messageDiv.style.display = "none";
    });

    // ========= Tutup modal =========
    const closeSearch = () => searchModal.classList.remove("is-active");
    document.getElementById("close-modal-button").addEventListener("click", closeSearch);
    document.getElementById("ok-modal-button").addEventListener("click", closeSearch);
    document.querySelector("#search-modal .modal-background").addEventListener("click", closeSearch);

    const closeConfirm = () => confirmModal.classList.remove("is-active");
    document.getElementById("confirm-ok").addEventListener("click", closeConfirm);
    document.getElementById("confirm-close-x").addEventListener("click", closeConfirm);
    confirmModal.querySelector(".modal-background").addEventListener("click", closeConfirm);
  </script>
</body>
</html>
